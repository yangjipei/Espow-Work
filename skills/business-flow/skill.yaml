id: business-flow
name: 业务流程
description: 把已确认的需求分析转化为结构化、可验证、可追踪和可版本化的业务流程
version: 0.2.0
mode:
  - flow
inputs:
  - shared_requirement_state
  - stage_working_state
  - upstream_stage_summaries
  - user_request
  - confirmed_requirement_analysis
  - requirement_snapshot
  - relevant_decisions
  - relevant_open_issues
  - existing_business_flow
outputs:
  - flow_scope
  - actors
  - nodes
  - edges
  - entry
  - exits
  - open_questions
  - flow_status
  - structured_diff
  - html_preview
allowed_tools:
  - workspace_read
  - artifact_find
  - artifact_read
  - business_flow_next_version
  - business_flow_ready
  - business_flow_submit
  - business_flow_write
  - workspace_validate
