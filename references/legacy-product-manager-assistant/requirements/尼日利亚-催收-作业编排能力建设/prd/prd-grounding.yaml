decisions:
  - ref: D001
    text: Decision Plan 按案件生成，每个案件每天一份并包含当日全部轮次及后续轮次条件
    impact: CONFIRMED
    status: 
  - ref: D002
    text: 下一轮到时若上一轮未完成，则上一轮记失败并继续执行下一轮条件判断
    impact: CONFIRMED
    status: 
  - ref: D003
    text: 服务商迟到回调只更新对应历史轮次结果，不影响当前及后续轮次执行
    impact: CONFIRMED
    status: 
  - ref: D004
    text: 人工处理与自动任务并行，页面仅提示自动任务，不限制人工触达或作业
    impact: CONFIRMED
    status: 
  - ref: D005
    text: 执行时间与日切统一按尼日利亚 WAT（UTC+1），日切后终止当日任务
    impact: CONFIRMED
    status: 
  - ref: D006
    text: MVP 自动工具范围为 IVR 和 AI Robot，最多支持 3 轮
    impact: CONFIRMED
    status: 
  - ref: D007
    text: Web 端不新增操作界面，但 PRD 必须在 Web 端章节完整编写催收系统的 Decision Plan 解析、轮次执行、工具推送、结果覆盖、异常记录和案件退出规则；App 端单独成章，仅负责自动作业信息展示
    impact: CONFIRMED
    status: 
  - ref: D008
    text: 异常信息不在 App 端展示，统一写入催收系统异常记录表，供后台查询与排障
    impact: CONFIRMED
    status: 
  - ref: D009
    text: App 端展示项仅保留“当前案件有无其他工具正在作业”，不展示自动作业状态、轮次、执行结果或异常信息
    impact: CONFIRMED
    status: 
