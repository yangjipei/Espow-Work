business_facts:
  - ref: LEGACY_BF001
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 尼日利亚-催收-作业编排能力建设｜业务流程
    capability: system-overview
    branches:
  - ref: LEGACY_BF002
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 1. 流程目标
    capability: system-overview
    branches:
  - ref: LEGACY_BF003
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 以决策引擎生成的案件级当日 Decision Plan 为唯一策略来源，由催收系统在 WAT（UTC+1）时区内可靠执行最多 3 轮 IVR / AI Robot 自动触达，并确保轮次可推进、投递不重复、回调可追溯、当日任务不跨日。
    capability: decision-plan
    branches:
  - ref: LEGACY_BF004
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 2. 参与方与边界
    capability: system-overview
    branches:
  - ref: LEGACY_BF005
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: | 参与方 | 流程职责 | 不承担的职责 |
    capability: system-overview
    branches:
  - ref: LEGACY_BF006
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: |---|---|---|
    capability: system-overview
    branches:
  - ref: LEGACY_BF007
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: | 决策引擎 | 判断自动编排准入；返回当日全部轮次、执行时间、工具及准入条件 | 不执行触达，不维护服务商执行状态 |
    capability: decision-plan
    branches:
  - ref: LEGACY_BF008
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: | 催收系统 | 保存计划快照；定时触发；执行条件；幂等投递；接收回调；记录状态、结果与退出原因 | 不本地配置或重算编排策略 |
    capability: dispatch-idempotency
    branches:
  - ref: LEGACY_BF009
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: | IVR / AI Robot 服务商 | 接收任务、执行自动触达、异步回调状态与结果 | 不决定后续轮次是否执行 |
    capability: round-execution
    branches:
  - ref: LEGACY_BF010
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: | 催收坐席 | 查看自动任务上下文并按现有能力人工处理 | 不作为自动 Tool，不控制自动计划启停 |
    capability: system-overview
    branches:
  - ref: LEGACY_BF011
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 3. 主流程
    capability: system-overview
    branches:
  - ref: LEGACY_BF012
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 阶段 A：生成当日计划
    capability: decision-plan
    branches:
  - ref: LEGACY_BF013
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 每个 WAT 业务日，催收系统按案件请求决策。
    capability: system-overview
    branches:
  - ref: LEGACY_BF014
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 决策引擎判断案件是否命中自动编排标签。
    capability: decision-plan
    branches:
  - ref: LEGACY_BF015
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 未命中：返回 `automation_enabled = false`，催收系统不创建自动轮次，流程结束。
    capability: round-execution
    branches:
  - ref: LEGACY_BF016
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 命中：返回 `automation_enabled = true` 及包含 1～3 轮的当日 Decision Plan。
    capability: decision-plan
    branches:
  - ref: LEGACY_BF017
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 催收系统校验计划可解析性，并以案件、业务日为粒度保存执行快照。
    capability: system-overview
    branches:
  - ref: LEGACY_BF018
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 计划不可解析：记录计划异常，不投递任何自动任务，转人工可见异常提示。
    capability: dispatch-idempotency
    branches:
  - ref: LEGACY_BF019
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 阶段 B：轮次到时与准入判断
    capability: round-execution
    branches:
  - ref: LEGACY_BF020
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 对每个计划轮次依次执行：
    capability: round-execution
    branches:
  - ref: LEGACY_BF021
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 到达本轮 WAT 执行时间。
    capability: round-execution
    branches:
  - ref: LEGACY_BF022
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 检查是否已日切；已日切则终止当日剩余轮次。
    capability: round-execution
    branches:
  - ref: LEGACY_BF023
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 检查本轮是否已进入终态；已进入则不重复处理。
    capability: system-overview
    branches:
  - ref: LEGACY_BF024
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 若存在上一轮且上一轮仍为处理中，将上一轮标记为超时失败。
    capability: round-execution
    branches:
  - ref: LEGACY_BF025
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 读取案件最新状态及历史轮次结果。
    capability: round-execution
    branches:
  - ref: LEGACY_BF026
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 执行 Decision Plan 中本轮准入条件。
    capability: decision-plan
    branches:
  - ref: LEGACY_BF027
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 条件不满足：本轮标记为跳过，记录条件判断结果与原因，然后等待下一轮。
    capability: round-execution
    branches:
  - ref: LEGACY_BF028
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 条件满足：进入幂等投递。
    capability: dispatch-idempotency
    branches:
  - ref: LEGACY_BF029
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 阶段 C：幂等投递与服务商执行
    capability: dispatch-idempotency
    branches:
  - ref: LEGACY_BF030
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 以 `case_id + business_date + round_no` 检查业务幂等键。
    capability: dispatch-idempotency
    branches:
  - ref: LEGACY_BF031
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 已存在成功投递记录：本次不再投递，记录重复触发并结束本轮触发动作。
    capability: dispatch-idempotency
    branches:
  - ref: LEGACY_BF032
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 不存在成功投递记录：生成唯一 `dispatch_id`，按 `tool_code` 路由至 IVR 或 AI Robot。
    capability: dispatch-idempotency
    branches:
  - ref: LEGACY_BF033
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 服务商受理成功：本轮进入处理中，等待异步回调。
    capability: callback-status
    branches:
  - ref: LEGACY_BF034
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 服务商受理失败或调用异常：本轮标记为投递失败；不即时重算编排，后续轮次仍按原计划到时判断。
    capability: round-execution
    branches:
  - ref: LEGACY_BF035
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 阶段 D：回调与结果更新
    capability: callback-status
    branches:
  - ref: LEGACY_BF036
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 服务商携带 `dispatch_id` 回调。
    capability: dispatch-idempotency
    branches:
  - ref: LEGACY_BF037
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 催收系统定位原业务日、原轮次投递记录。
    capability: round-execution
    branches:
  - ref: LEGACY_BF038
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 无法定位：记录孤立回调异常，不改变任何轮次。
    capability: round-execution
    branches:
  - ref: LEGACY_BF039
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 可以定位：按回调映射更新原轮次状态、结果及回调时间，并保留回调轨迹。
    capability: round-execution
    branches:
  - ref: LEGACY_BF040
    stage_id: LEGACY_S1
    stage: 历史业务流程
    type: action
    actor: 
    text: 若原轮次已因超时失败或日切终止，回调仅更新该轮次的最新执行结果及迟到标识，不回滚、不取消、不影响当前或后续轮次。
    capability: round-execution
    branches:
